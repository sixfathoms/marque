# goreleaser is configured here and releases nothing. The point at M0 is to
# find out now whether the cgo release matrix works, rather than at version 0.1
# (implementation plan, M0 step 5).
#
# Why a native runner per platform rather than one job building everything:
# CGO_ENABLED=1 is not optional, because the grammar parses statements with
# PostgreSQL's own parser via libpg_query, which is C (EDR-0039). A cgo build
# needs a C toolchain for the *target*, so the usual single-job matrix build
# does not apply. Each runner therefore builds only its own slice, with
# `goreleaser build --snapshot --single-target`; the matrix below is the full
# supported set, not what any one job produces.
version: 2

project_name: marque

builds:
  # The three binaries share everything but their entry point. They are listed
  # separately rather than generated because a reviewer should be able to read
  # the list and see three, which is the property EDR-0001 cares about.
  - &build
    id: marque
    main: ./cmd/marque
    binary: marque
    env:
      - CGO_ENABLED=1
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # These three variables are the ones internal/version reads. If they are
    # renamed there and not here, a released binary silently reports "dev" —
    # the ldflags path fails quietly, which is why internal/version has a test
    # asserting Get() returns something.
    ldflags:
      - -X github.com/sixfathoms/marque/internal/version.buildVersion={{ .Version }}
      - -X github.com/sixfathoms/marque/internal/version.buildCommit={{ .ShortCommit }}
      - -X github.com/sixfathoms/marque/internal/version.buildSourceDate={{ .CommitDate }}
    # The commit's timestamp, not the build's, for the same reason the Makefile
    # stamps a source date: the same commit should produce the same artefact.
    mod_timestamp: '{{ .CommitTimestamp }}'

  - <<: *build
    id: harbourmaster
    main: ./cmd/harbourmaster
    binary: harbourmaster

  - <<: *build
    id: pilot
    main: ./cmd/pilot
    binary: pilot

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

changelog:
  # The changelog is written by hand, one file per entry, and globbed by the
  # docs build. Generating a second one from commit subjects would produce a
  # rival account of the same changes.
  disable: true

# Nothing publishes. Removing this line is a deliberate act, not a detail: the
# release path is not built, not reviewed, and has no signing story yet.
release:
  disable: true
