name: CI

# No paths filter, deliberately. A Go build's inputs sprawl across go.mod, the
# Makefile, .golangci.yml and tools/, and a filter that forgets one of them is a
# workflow that silently does not run — which, at the merge button, is
# indistinguishable from one that passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms report, so a failure on one does not hide the other's
      # result. cgo is where they diverge, and that is the whole reason for a
      # matrix this early (EDR-0039).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: make build
      - run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: make lint

  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking reads main out of the local git repository, so the
          # default single-commit checkout is not enough.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Generated code is committed so a reviewer sees the wire contract change
      # in the diff (EDR-0020). This is what keeps it honest.
      - name: generated code matches the schema
        run: make generate-check
      - name: no breaking change to the wire contract
        env:
          # On a push to main, origin/main *is* the commit being pushed, so
          # comparing against it compares the schema with itself and passes
          # whatever it is given. The previous tip is the meaningful base.
          # Passed through the environment rather than interpolated into the
          # run block, so no context value is ever shell.
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: make breaking BASE_REF="$BASE_REF"

  snapshot:
    name: snapshot (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports. A cgo build breaks per-platform, so the whole
      # point is seeing which ones — hiding the rest behind the first failure
      # would mean learning them one merge at a time.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64 }
          - { os: macos-latest, platform: darwin/arm64 }
          - { os: macos-15-intel, platform: darwin/amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For the tags, not for refusal. A shallow clone does not fail here
          # — it quietly derives a version from no tags at all, so the snapshot
          # names a lineage that is not the repository's. `fetch-tags: true`
          # at depth 1 would do as well; full history is negligible here.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Builds the platform's own slice of the release matrix and asserts that
      # make and goreleaser agree about what they built.
      - run: make snapshot-check
