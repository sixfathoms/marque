name: CI

# No paths filter, deliberately. A Go build's inputs sprawl across go.mod, the
# Makefile, .golangci.yml and tools/, and a filter that forgets one of them is a
# workflow that silently does not run — which, at the merge button, is
# indistinguishable from one that passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      # The test tier: one runner per operating system, as a sample rather
      # than a proof — see the plan's "What green in CI covers", which says
      # plainly that this is a cost decision. M2's exit criterion is what
      # widens it to four, because from there the parser is C (EDR-0039). The
      # build-and-smoke tier below already covers all four platforms.
      #
      # Both platforms report, so a failure on one does not hide the other's
      # result.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64 }
          - { os: macos-latest, platform: darwin/arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # make reads the working tree with git to stamp the version, on
          # every invocation and before any recipe runs. Every one of those
          # reads is local — rev-parse, status, describe, log — so nothing
          # here needs the token to persist. Uniform with the other jobs: a
          # selectively-hardened workflow reads as though the jobs that set the
          # flag needed it for some particular reason, and none of them do.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # The plan names this tier's platforms, so the runner has to say it is
      # one of them. `macos-latest` has already migrated Intel to ARM once;
      # without this the plan's table would go quietly false while CI stayed
      # green, which is the exact disagreement this job's tier was written to
      # settle. Same guard the snapshot job uses, same reason.
      - env:
          EXPECT_PLATFORM: ${{ matrix.platform }}
        run: |
          test -n "$EXPECT_PLATFORM" || {
            echo "this matrix entry has no platform:, so the runner would not be checked"
            exit 1
          }
          make platform-check
      - run: make build
      - run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: make lint

  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking reads main out of the local git repository, so the
          # default single-commit checkout is not enough.
          fetch-depth: 0
          # Safe despite this being the job that reads history beyond HEAD:
          # `make breaking` and buf's `.git#ref=` input both work against the
          # local clone — buf clones it over a file:// URL — so no credential
          # and no remote is involved. fetch-depth: 0 above is what makes that
          # true.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Generated code is committed so a reviewer sees the wire contract change
      # in the diff (EDR-0020). This is what keeps it honest.
      - name: generated code matches the schema
        run: make generate-check
      - name: no breaking change to the wire contract
        env:
          # On a push to main, origin/main *is* the commit being pushed, so
          # comparing against it compares the schema with itself and passes
          # whatever it is given. The previous tip is the meaningful base.
          # Passed through the environment rather than interpolated into the
          # run block, so no context value is ever shell.
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: make breaking BASE_REF="$BASE_REF"

  snapshot:
    name: snapshot (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      # The build-and-smoke tier, and the one that must not shrink: it is all
      # that stands between a platform that cannot build and a release that
      # claims it.
      #
      # Every platform reports. A cgo build breaks per-platform, so the whole
      # point is seeing which ones — hiding the rest behind the first failure
      # would mean learning them one merge at a time.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64 }
          - { os: macos-latest, platform: darwin/arm64 }
          - { os: macos-15-intel, platform: darwin/amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For the tags, not for refusal. A shallow clone does not fail here
          # — it quietly derives a version from no tags at all, so the snapshot
          # names a lineage that is not the repository's. `fetch-tags: true` at
          # depth 1 is NOT equivalent: it brings the tag objects without the
          # commits between tag and HEAD, so `git describe` cannot compute the
          # distance and fails unless HEAD is itself tagged. Full history here
          # is negligible.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # Builds the platform's own slice of the release matrix and asserts that
      # make and goreleaser agree about what they built.
      #
      # EXPECT_PLATFORM is checked against `go env`, because --single-target
      # builds whatever the host happens to be: without it, a mutable runner
      # label that changed architecture would leave the matrix reporting four
      # slices while building the same one twice.
      - env:
          EXPECT_PLATFORM: ${{ matrix.platform }}
        # The emptiness check is not defensive noise: make skips the assertion
        # when the variable is unset, which is right for local use and wrong
        # here. A matrix entry added without `platform:` would otherwise be
        # green with the platform assertion silently disabled.
        run: |
          test -n "$EXPECT_PLATFORM" || {
            echo "this matrix entry has no platform:, so the runner would not be checked"
            exit 1
          }
          make snapshot-check
