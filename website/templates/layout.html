<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- NOT PUBLIC-FACING YET. Marque is at design stage and this site is deliberately kept out of
       search results and web archives. These meta directives are the ONLY lever available here: a
       robots.txt is honoured at a domain root, and this is a project site served at a subpath, so a
       robots.txt in this repository would land at /marque/robots.txt and be ignored. Do not remove
       these tags until the project is deliberately made public. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="ia_archiver" content="noindex, noarchive" />
  <meta name="archive.org_bot" content="noindex, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>{{title}}</title>
  <link rel="icon" href="{{base}}/img/favicon.svg" />
  <link rel="stylesheet" href="{{base}}/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{base}}/">marque</a>
      <nav>
        {{nav}}
      </nav>
    </div>
  </header>
  <main class="container">
    {{body}}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p><strong>Marque</strong> — reviewed, approved, time-bounded access to production data.
      New here? Start with the <a href="{{base}}/overview/introduction/">introduction</a>, or read
      the <a href="{{base}}/overview/architecture/">architecture</a>.
      Decisions are recorded in <a href="{{base}}/edrs/">decision records</a>;
      what changed is in the <a href="{{base}}/changelog/">changelog</a>.
      Built by <a href="https://sixfathoms.dev/">Six Fathoms</a> ·
      <a href="{{repo_url}}">source</a>.</p>
    </div>
  </footer>
  {{scripts}}
</body>
</html>
